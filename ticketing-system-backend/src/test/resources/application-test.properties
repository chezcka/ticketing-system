# Server Configuration
server.port=8080

# Database Configuration - H2 In-Memory for Testing
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# SQL initialization
spring.sql.init.mode=never

# JWT Configuration
jwt.secret=your_super_secret_key_that_is_long_enough_for_hs512_algorithm_minimum_64_chars_1234567890
jwt.expiration=86400000

# Email Configuration (Disabled for testing)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=test-password
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# Logging
logging.level.root=WARN
logging.level.org.example.ticketingsystem=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
