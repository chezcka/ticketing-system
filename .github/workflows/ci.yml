name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ticketing_system
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
        ports:
          - 3306:3306

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Build and test backend
      working-directory: ./ticketing-system-backend
      run: |
        chmod +x ./gradlew
        ./gradlew clean build -Dspring.profiles.active=test
    
    - name: Upload backend test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: backend-test-results
        path: ticketing-system-backend/build/test-results/

  frontend-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ticketing-system-frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: ./ticketing-system-frontend
      run: npm ci
    
    - name: Lint
      working-directory: ./ticketing-system-frontend
      run: npm run lint
      continue-on-error: true
    
    - name: Build
      working-directory: ./ticketing-system-frontend
      run: npm run build

  backend-build:
    runs-on: ubuntu-latest
    needs: backend-test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Build backend
      working-directory: ./ticketing-system-backend
      run: |
        chmod +x ./gradlew
        ./gradlew bootJar
    
    - name: Upload backend artifact
      uses: actions/upload-artifact@v3
      with:
        name: backend-jar
        path: ticketing-system-backend/build/libs/

  frontend-build:
    runs-on: ubuntu-latest
    needs: frontend-test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: ticketing-system-frontend/package-lock.json
    
    - name: Install dependencies
      working-directory: ./ticketing-system-frontend
      run: npm ci
    
    - name: Build frontend
      working-directory: ./ticketing-system-frontend
      run: npm run build
    
    - name: Upload frontend artifact
      uses: actions/upload-artifact@v3
      with:
        name: frontend-build
        path: ticketing-system-frontend/dist/
